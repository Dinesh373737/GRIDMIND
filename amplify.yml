version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm ci --prefix frontend --no-audit --no-fund
    build:
      commands:
        - npm run build --prefix frontend
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
